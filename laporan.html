
<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan • SDN Cikampek Barat 2</title><link rel="stylesheet" href="css/style.css"></head><body data-page="laporan">
<header class="topbar"><div class="top-left"><button class="menu-btn">☰</button><div><div class="head-title">LAPORAN KEHADIRAN</div><div class="head-sub">Rekap absensi guru</div></div></div><div class="clock"><span data-clock>00:00:00</span> WIB</div></header>
<div class="body"><aside class="sidebar"><div class="school-brand"><div class="school-logos"><div class="school-logo">🏛️</div><div class="school-logo">🎓</div><div class="school-logo">🏫</div></div><div class="school-name">SDN CIKAMPEK BARAT 2</div><div class="school-tag">SISTEM ABSENSI DIGITAL</div></div><nav class="nav"><a href="index.html" data-page="dashboard">◕ <span>Dashboard</span></a><a href="guru.html" data-page="guru">👥 <span>Data Guru</span></a><a href="absensi.html" data-page="absensi">▦ <span>Absensi</span></a><a href="laporan.html" data-page="laporan">▤ <span>Laporan</span></a><a href="pengaturan.html" data-page="pengaturan">⚙ <span>Pengaturan</span></a></nav></aside>
<main class="main"><div class="page-head"><div><h1>Laporan Kehadiran</h1><p>Filter data dan unduh rekap dalam format CSV/Excel-compatible.</p></div></div>
<div class="card"><div class="report-filters"><input class="field input" type="date" id="date"><select class="field input" id="guru"><option value="">Semua Guru</option></select><select class="field input" id="status"><option value="">Semua Status</option><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpha</option></select><button class="btn btn-primary" id="csv">⬇️ Unduh CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>No</th><th>Tanggal</th><th>Jam</th><th>ID</th><th>Nama Guru</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div></div>
</main></div>
<script src="js/app.js"></script><script>
function fill(){document.getElementById("guru").innerHTML='<option value="">Semua Guru</option>'+DB.teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.nama)}</option>`).join("")}
function render(){let d=document.getElementById("date").value,g=document.getElementById("guru").value,s=document.getElementById("status").value;let a=DB.attendance.slice().reverse();if(d)a=a.filter(x=>x.tanggal===d);if(g)a=a.filter(x=>x.id===g);if(s)a=a.filter(x=>x.status===s);document.getElementById("body").innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td>${x.tanggal}</td><td>${x.jam}</td><td>${esc(x.id)}</td><td>${esc(x.nama)}</td><td><span class="badge ${x.status.toLowerCase()}">${esc(x.status)}</span></td></tr>`).join("")||'<tr><td colspan="6" class="empty">Tidak ada data.</td></tr>'}
["date","guru","status"].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById("csv").onclick=()=>{let d=document.getElementById("date").value,g=document.getElementById("guru").value,s=document.getElementById("status").value,a=DB.attendance.slice();if(d)a=a.filter(x=>x.tanggal===d);if(g)a=a.filter(x=>x.id===g);if(s)a=a.filter(x=>x.status===s);downloadCSV("laporan_kehadiran_guru.csv",[["Tanggal","Jam","ID Guru","Nama Guru","Status"],...a.map(x=>[x.tanggal,x.jam,x.id,x.nama,x.status])])};
fill();render();
</script></body></html>
